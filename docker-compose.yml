services:

  # ── PostgreSQL Data Warehouse ───────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       dw
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persist data
      - ./app/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"     # expose for local debugging, remove in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: app/backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/dw
      MODEL_PATH:   ./absa_model_final
    volumes:
      - ./backend:/app                        # hot reload during development
      - model_cache:/app/absa_model_final     # persist downloaded models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy            # wait for postgres to be ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (React Dashboard) ──────────────────────────────
  frontend:
    build:
      context: app/frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000     # backend URL (from browser)
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src               # hot reload during development

volumes:
  postgres_data:    # named volume — survives container restarts
  model_cache:      # named volume — avoids re-downloading models