services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       dw
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/dw
      # /model_cache (dentro do próprio filesystem do container), não o
      # bind mount ./absa_module: ler um model.safetensors recém-escrito no
      # host através do bind mount Windows->WSL2 do Docker Desktop produz
      # pesos incorretos sem erro (bytes idênticos por I/O simples - MD5
      # confere - mas a leitura usada por transformers/safetensors carrega
      # o modelo errado). Depois de treinar um modelo novo, correr:
      #   docker cp absa_module/absa_model_final_polarity/. backend:/model_cache/
      #   docker restart backend
      MODEL_PATH:   /model_cache
    volumes:
      - ./backend:/app
      - ./absa_module:/absa_module:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: "http://backend:8000"
    volumes:
      - ./frontend:/app/frontend
      - ./backend/models:/app/backend/models:ro
      - ./absa_module:/app/absa_module:ro
    ports:
      - "8050:8050"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: